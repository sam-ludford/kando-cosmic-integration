[package]
name = "kando-cosmic-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DBus helper daemon that gives Kando access to COSMIC/Wayland state"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
